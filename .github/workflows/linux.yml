name: HashLink Linux

on:
  push:
    branches:
      - haxe-binding-v3
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  hashlink:
    name: Build and test quadrants.hdll
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            git \
            haxe \
            libmbedtls-dev \
            libopenal-dev \
            libpcre3-dev \
            libpng-dev \
            libsdl2-dev \
            libsqlite3-dev \
            libturbojpeg0-dev \
            libuv1-dev \
            ninja-build \
            unzip \
            zlib1g-dev
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install LLVM 22 toolchain
        run: |
          set -eux
          LLVM_VERSION=22.1.0
          LLVM_BUILD=202603120808
          LLVM_ROOT="$RUNNER_TOOL_CACHE/quadrants-llvm-${LLVM_VERSION}-${LLVM_BUILD}"
          if [ ! -x "$LLVM_ROOT/bin/clang" ]; then
            ARCHIVE="$RUNNER_TEMP/llvm.zip"
            EXTRACT="$RUNNER_TEMP/llvm"
            rm -rf "$EXTRACT" "$LLVM_ROOT"
            mkdir -p "$EXTRACT" "$LLVM_ROOT"
            curl -L \
              "https://github.com/Genesis-Embodied-AI/quadrants-sdk-builds/releases/download/llvm-${LLVM_VERSION}-${LLVM_BUILD}/taichi-llvm-${LLVM_VERSION}-linux-x86_64.zip" \
              -o "$ARCHIVE"
            unzip -q "$ARCHIVE" -d "$EXTRACT"
            shopt -s dotglob
            mv "$EXTRACT"/*/* "$LLVM_ROOT"/
          fi
          echo "LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"
          echo "$LLVM_ROOT/bin" >> "$GITHUB_PATH"

      - name: Build HashLink from source
        run: |
          set -eux
          HASHLINK_ROOT="$RUNNER_TEMP/hashlink"
          git clone --depth 1 https://github.com/HaxeFoundation/hashlink.git "$HASHLINK_ROOT"
          make -C "$HASHLINK_ROOT" -j2
          echo "QD_HASHLINK_ROOT=$HASHLINK_ROOT" >> "$GITHUB_ENV"
          echo "$HASHLINK_ROOT" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HASHLINK_ROOT:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure Quadrants HashLink build
        run: |
          cmake -S . -B build/hashlink-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_ROOT/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_ROOT/bin/clang++" \
            -DLLVM_DIR="$LLVM_ROOT/lib/cmake/llvm" \
            -DCLANG_EXECUTABLE="$LLVM_ROOT/bin/clang" \
            -DQD_WITH_HASHLINK=ON \
            -DQD_HASHLINK_ROOT="$QD_HASHLINK_ROOT" \
            -DQD_BUILD_HASHLINK_TESTS=ON \
            -DQD_BUILD_TESTS=ON \
            -DQD_WITH_LLVM=ON \
            -DQD_WITH_CUDA=OFF \
            -DQD_WITH_VULKAN=OFF \
            -DQD_WITH_METAL=OFF \
            -DQD_WITH_AMDGPU=OFF

      - name: Build quadrants.hdll, runtime bitcode, and C++ tests
        run: |
          cmake --build build/hashlink-ci --target quadrants.hdll quadrants_cpp_tests

      - name: Install HashLink component
        run: |
          rm -rf build/hashlink-install
          cmake --install build/hashlink-ci --component hashlink --prefix build/hashlink-install
          find build/hashlink-install/share/quadrants -maxdepth 3 -type f | sort

      - name: Haxe/haxelib smoke test
        run: |
          haxelib dev quadrants "$PWD/build/hashlink-install/share/quadrants/hashlink"
          haxe -lib quadrants -cp tests/hashlink/v3 -main Smoke -hl build/hashlink-installed-smoke.hl
          QD_LIB_DIR="$PWD/build/hashlink-install/share/quadrants/hashlink/runtime" \
          LD_LIBRARY_PATH="$PWD/build/hashlink-install/share/quadrants/hashlink:$QD_HASHLINK_ROOT:${LD_LIBRARY_PATH:-}" \
          hl build/hashlink-installed-smoke.hl

      - name: CTest HashLink and C++ suites
        run: |
          ctest --test-dir build/hashlink-ci --output-on-failure
